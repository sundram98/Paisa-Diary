name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: Remove adaptive icon files only if the background is missing
        run: |
          if [ -z "$(find android/app/src/main/res -name 'ic_launcher_background*' | head -1)" ]; then
            rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
          fi
      - run: npx cap sync android
      - name: Allow notifications permission
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $f
          grep -q WRITE_EXTERNAL_STORAGE $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' $f
          grep -q requestLegacyExternalStorage $f || sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $f
          grep -q USE_BIOMETRIC $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' $f
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PaisaDiary-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
